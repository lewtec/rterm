name: rterm
options:
  bundleIdPrefix: br.tec.lew
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.20.0
targets:
  rterm:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.tec.lew.rterm
        PRODUCT_NAME: rterm
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: rterm
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_NSPrefersDisplaySafeAreaCompatibilityMode: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_TESTABILITY: YES
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
    scheme:
      testTargets:
        - rtermTests
  rtermTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: rterm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.tec.lew.rterm.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/rterm.app/Contents/MacOS/rterm"
        BUNDLE_LOADER: "$(TEST_HOST)"
