# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
project_name: rterm

# Rust builder defaults (GoReleaser 2.18):
# command zigbuild, targets
#   x86_64-unknown-linux-gnu
#   aarch64-unknown-linux-gnu
#   x86_64-apple-darwin
#   aarch64-apple-darwin
#   x86_64-pc-windows-gnu
# zig and cargo-zigbuild come from mise.toml.
before:
  hooks:
    - bash scripts/macos-sdk.sh

builds:
  - builder: rust
    binary: rterm
    flags:
      - --release
      - --locked
    env:
      - RTERM_VERSION={{ .Version }}
      - >-
        {{- if eq .Os "darwin" -}}
        SDKROOT={{ env "HOME" }}/.cache/rterm/MacOSX14.5.sdk
        {{- end -}}
      - >-
        {{- if eq .Os "darwin" -}}
        MACOSX_DEPLOYMENT_TARGET=14.0
        {{- end -}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
