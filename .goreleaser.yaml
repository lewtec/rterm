# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
#
# The Mac .app is built by scripts/package-dmg.sh. GoReleaser only
# attaches that DMG to the GitHub release.

version: 2
project_name: rterm

# skip+non-go: goreleaser still defaults builder to go, then runs `go list -m`.
builds:
  - skip: true
    builder: rust

archives:
  - formats: [none]

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: artifacts/*.dmg

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  extra_files:
    - glob: artifacts/*.dmg
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
