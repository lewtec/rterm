name: Autorelease

on:
  push:
    branches:
      - main
    # Do not trigger on tags: the release job pushes a tag, which would
    # re-enter this workflow and mint another version.
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      new_version:
        description: "New tag version"
        type: choice
        default: "patch"
        options:
          - next
          - patch
          - minor
          - major
  schedule:
    - cron: "0 2 * * 6" # saturday 2am

# CI runs on Ubuntu. A dispatch release lets GoReleaser build every default
# Rust target under one svu tag. It does not call `mise release` (that tags twice).
jobs:
  ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5

      - name: CI
        run: mise run ci

  version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.svu.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5

      - name: Compute tag
        id: svu
        env:
          NEW_VERSION: ${{ github.event.inputs.new_version }}
        run: |
          set -euo pipefail
          TAG="$(svu "$NEW_VERSION")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

  release:
    needs: version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup git config
        run: |
          git config user.name actions-bot
          git config user.email actions-bot@users.noreply.github.com

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5

      - name: Publish
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          if ! goreleaser release --clean; then
            git tag -d "$TAG"
            exit 1
          fi
          git push origin "refs/tags/$TAG"
