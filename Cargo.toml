[package]
name = "rterm"
version = "0.1.0"
edition = "2024"
publish = false
description = "One window of detachable herdr, tmux, and screen places"

[dependencies]
ab_glyph = "0.2.32"
arboard = { version = "3", default-features = false, features = ["image-data"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
notify = "7.0"
portable-pty = "0.9"
rustybuzz = "0.20"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.3"
block2 = "0.5.1"
objc2-app-kit = { version = "0.2.2", default-features = false, features = [
    "std",
    "block2",
    "NSApplication",
    "NSEvent",
    "NSImage",
    "NSPasteboard",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["std", "NSGeometry"] }
raw-window-handle = "0.6"
