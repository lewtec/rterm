[tools]
xcodegen = "2.46.0"
goreleaser = "2.17.1"
svu = "3.3.0"

[tasks.generate]
description = "Regenerate rterm.xcodeproj from project.yml"
run = "xcodegen generate"

[tasks.install]
description = "Generate the Xcode project"
depends = ["generate"]

[tasks.build]
description = "Debug-build the Mac app"
run = "xcodebuild -project rterm.xcodeproj -scheme rterm -configuration Debug -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation build"
depends = ["generate"]

[tasks.run]
description = "Debug-build and launch the Mac app"
alias = "default"
depends = ["build"]
run = '''
set -euo pipefail
dir="$(
  xcodebuild \
    -project rterm.xcodeproj \
    -scheme rterm \
    -configuration Debug \
    -destination 'platform=macOS,arch=arm64' \
    -skipPackagePluginValidation \
    -showBuildSettings \
    2>/dev/null \
  | awk -F' = ' '/^    BUILT_PRODUCTS_DIR / { print $2; exit }'
)"
app="${dir}/rterm.app"
if [[ -z "$dir" || ! -d "$app" ]]; then
  echo "run: missing ${app:-rterm.app}" >&2
  exit 1
fi
open "$app"
'''

[tasks.test]
description = "Run catalog unit tests"
run = "xcodebuild -project rterm.xcodeproj -scheme rterm -configuration Debug -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation test"
depends = ["generate"]

[tasks.ci]
description = "CI checks"
depends = ["test"]

[tasks.package]
description = "Build a Release DMG into artifacts/"
run = "bash scripts/package-dmg.sh"
depends = ["generate"]

[tasks."release:check"]
description = "Validate .goreleaser.yaml"
run = "goreleaser check"

[tasks.release]
description = "Tag with svu, build a DMG, publish with GoReleaser"
depends = ["ci"]
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = '''
TAG="$(svu ${usage_version})"
echo "Releasing tag: $TAG (svu current=$(svu current 2>/dev/null || echo none))"
if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
  echo "Tag $TAG already exists" >&2
  exit 1
fi
git tag "$TAG"
if ! VERSION="$TAG" bash scripts/package-dmg.sh; then
  git tag -d "$TAG"
  exit 1
fi
if ! goreleaser release --clean; then
  git tag -d "$TAG"
  exit 1
fi
git push origin "refs/tags/$TAG"
'''
