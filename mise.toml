# Rust toolchain via mise. Linux builds use the conda gcc/binutils
# prefixes because the host `cc` shim is not a compiler rustc can run.
[tools]
rust = { version = "1.93.0", components = ["rustfmt", "clippy"] }
goreleaser = "2.18.3"
svu = "3.3.0"
zig = "0.16.0"
"ubi:rust-cross/cargo-zigbuild" = "0.24.1"
"conda:gcc" = { version = "16.2.0", os = ["linux"] }
"conda:binutils" = { version = "2.46.1", os = ["linux"] }

[tasks.install]
description = "Fetch Cargo dependencies"
run = "bash scripts/cargo.sh fetch --locked"

[tasks.fmt]
description = "Format Rust sources"
run = "bash scripts/cargo.sh fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "bash scripts/cargo.sh fmt --all -- --check"

[tasks.lint]
description = "Run clippy"
run = "bash scripts/cargo.sh clippy --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run library tests"
run = "bash scripts/cargo.sh test --locked"

[tasks.build]
description = "Release-build the rterm binary"
run = "bash scripts/cargo.sh build --locked --release"

[tasks.run]
description = "Build and launch rterm"
alias = "default"
run = "bash scripts/cargo.sh run --locked"

[tasks.package]
description = "Build a Release DMG into artifacts/ (macOS)"
run = "bash scripts/package-dmg.sh"

[tasks."release:check"]
description = "Validate .goreleaser.yaml"
run = "goreleaser check"

[tasks.ci]
description = "Format, lint, test, and build"
depends = ["fmt:check", "lint", "test", "build"]

[tasks.release]
description = "Tag with svu and publish with GoReleaser"
depends = ["ci"]
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = '''
set -euo pipefail
TAG="$(svu ${usage_version})"
echo "Releasing tag: $TAG (svu current=$(svu current 2>/dev/null || echo none))"
if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
  echo "Tag $TAG already exists" >&2
  exit 1
fi
git tag "$TAG"
if [[ "$(uname)" == Darwin ]]; then
  if ! VERSION="$TAG" bash scripts/package-dmg.sh; then
    git tag -d "$TAG"
    exit 1
  fi
fi
if ! goreleaser release --clean; then
  git tag -d "$TAG"
  exit 1
fi
if compgen -G "artifacts/*.dmg" >/dev/null; then
  gh release upload "$TAG" artifacts/*.dmg --clobber
fi
git push origin "refs/tags/$TAG"
'''
